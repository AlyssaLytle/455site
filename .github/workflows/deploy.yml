name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [ main ] # Change to master if your default branch is master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-cache: npm # Options: npm, yarn, or pnpm depending on your lockfile

      - name: Install dependencies
        run: npm ci # Or 'yarn install --frozen-lockfile' or 'pnpm install --frozen-lockfile'

      - name: Build Slidev presentations
        run: npx slidev build 01-proofs.md 02-DFAs.md --base /${{ github.event.repository.name }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ # Points to the root build output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
