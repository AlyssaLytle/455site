name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: nci

      - name: Build presentations
        run: |
          nr build 01-proofs.md \
            --out dist/01-proofs \
            --base /${{ github.event.repository.name }}/01-proofs/

          nr build 02-DFAs.md \
            --out dist/02-DFAs \
            --base /${{ github.event.repository.name }}/02-DFAs/

      - name: Create landing page
        run: |
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8">
              <title>Slide Decks</title>
            </head>
            <body>
              <h1>Slide Decks</h1>
              <ul>
                <li><a href="./01-proofs/">Proofs</a></li>
                <li><a href="./02-DFAs/">DFAs</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5